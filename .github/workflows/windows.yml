name: Windows preview verification
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build experimental desktop application
        shell: powershell
        run: ./scripts/build.ps1
      - name: Verify without phone calls or Bluetooth access
        shell: powershell
        run: ./scripts/verify.ps1
      - name: Upload experimental preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhoneDeck-experimental-no-call-audio
          path: |
            out/PhoneDeck.exe
            out/build.json
            README.md
            LICENSE
          retention-days: 7
